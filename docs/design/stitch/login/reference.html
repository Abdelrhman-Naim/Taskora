<!-- Micro-interaction for Password Visibility Toggle -->
<script>
    const passwordInput = document.getElementById('auth-password');
    const visibilityBtn = document.getElementById('password-visibility-btn');
    const visibilityIcon = visibilityBtn ? visibilityBtn.querySelector('.material-symbols-outlined') : null;

    if (visibilityBtn && passwordInput && visibilityIcon) {
      visibilityBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        visibilityIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        visibilityIcon.setAttribute('data-icon', isPassword ? 'visibility_off' : 'visibility');
        if (isPassword) {
          passwordInput.classList.remove('tracking-widest');
        } else {
          passwordInput.classList.add('tracking-widest');
        }
      });
    }
  </script>
